name: Check upstream skills

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-skills
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Run importer tests
        run: python3 -m unittest discover -s tests -v
      - name: Check upstream and request review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py
